    <div class="container">
        <div class="section-card">
            <p>
                If you’re interested in working together, sharing ideas, or just talking
                about AI, React, or Unity, feel free to reach out.
            </p>

            <form class="contact-form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="your@email.com">

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Your message"></textarea>

                <button type="submit">Send Message</button>
            </form>

            <div class="contact-links">
                <p>Or connect with me here:</p>
                <a href="https://github.com/EdsonRay05" target="_blank">GitHub</a> |
                <a href="https://www.linkedin.com/in/edson-ray-335672324/" target="_blank">LinkedIn</a> |
                <a href="https://mail.google.com/mail/u/0/#inbox">Email</a>
            </div>
        </div>
    </div>

    <footer class="site-footer">
